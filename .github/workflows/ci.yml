name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-area-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: green-area-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: pytest tests/ -v
      # Dependency vulnerability scan — informational for now (continue-on-error).
      # Flip to blocking by removing continue-on-error once advisories are triaged.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-area-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: green-area-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npx eslint src --max-warnings 0
      - name: Run tests
        run: npm test
      - name: Build (vite)
        run: npm run build
      # --omit=dev = production deps only (currently clean) — devDependencies
      # (vite/vitest/esbuild toolchain) carry known advisories that need a
      # breaking major-version bump to clear, so they're excluded here rather
      # than making the whole job informational like backend's pip-audit.
      - name: Audit dependencies (npm audit)
        run: npm audit --omit=dev
