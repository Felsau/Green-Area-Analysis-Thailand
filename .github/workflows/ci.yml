name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-area-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: green-area-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Run tests
        run: pytest tests/ -v
      # Dependency vulnerability scan — informational for now (continue-on-error).
      # Flip to blocking by removing continue-on-error once advisories are triaged.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: green-area-frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: green-area-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npx eslint src --max-warnings 0
      - name: Run tests
        run: npm test
      - name: Build (vite)
        run: npm run build
      # --omit=dev = production deps only · devDependencies (vite/vitest/esbuild
      # toolchain) carry known advisories that need a breaking major-version bump
      # to clear, so they stay excluded here.
      #
      # continue-on-error since 2026-08-11: production deps are no longer clean.
      # @deck.gl/geo-layers pulls image-size through texture-compressor →
      # @loaders.gl/textures → gltf → 3d-tiles, and image-size has TWO high DoS
      # advisories (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq) with **no patched
      # version published** — every release up to the current 2.0.2 is affected,
      # so no override can clear them. npm's only suggested "fix" is downgrading
      # geo-layers 9.3.4 → 8.9.36, a major-version *downgrade* that would break
      # the map (we use the deck.gl 9 API).
      #
      # Practical exposure is low: those parsers only run when decoding ICNS/JXL/
      # HEIF textures for 3D tiles and glTF, and this app renders 2D layers only —
      # it never loads that path. Keeping the step visible (not deleted) so the
      # report still prints and a newly-added advisory stays noticeable.
      #
      # Flip back to blocking (remove continue-on-error) once image-size ships a
      # patch and deck.gl picks it up. dompurify was the one fixable advisory and
      # is already pinned via `overrides` in package.json.
      - name: Audit dependencies (npm audit)
        run: npm audit --omit=dev
        continue-on-error: true
