<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     font-family="'TH Sarabun New','Sarabun','Leelawadee UI','Tahoma',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ===================== satellite ===================== -->
  <g>
    <rect x="558" y="42" width="52" height="26" rx="3" fill="#5b8dd6"/>
    <line x1="571" y1="42" x2="571" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="584" y1="42" x2="584" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="597" y1="42" x2="597" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="670" y="42" width="52" height="26" rx="3" fill="#5b8dd6"/>
    <line x1="683" y1="42" x2="683" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="696" y1="42" x2="696" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="709" y1="42" x2="709" y2="68" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="610" y1="55" x2="626" y2="55" stroke="#94a3b8" stroke-width="3"/>
    <line x1="654" y1="55" x2="670" y2="55" stroke="#94a3b8" stroke-width="3"/>
    <rect x="624" y="34" width="32" height="42" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="640" y1="76" x2="640" y2="86" stroke="#94a3b8" stroke-width="2.5"/>
    <path d="M626,98 a16,16 0 0 1 28,0 z" fill="#94a3b8"/>
  </g>
  <text x="640" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ดาวเทียม Sentinel-2 และ Landsat 8/9</text>

  <line x1="640" y1="140" x2="640" y2="188" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="652" y="160" font-size="13" fill="#4b5563">ภาพถ่ายดาวเทียม</text>
  <text x="652" y="177" font-size="13" fill="#4b5563">(ดึงจากคลังข้อมูลบนคลาวด์)</text>

  <!-- ===================== google earth engine ===================== -->
  <g>
    <ellipse cx="606" cy="240" rx="34" ry="27" fill="#cfe9d9"/>
    <ellipse cx="648" cy="228" rx="42" ry="33" fill="#cfe9d9"/>
    <ellipse cx="686" cy="242" rx="30" ry="24" fill="#cfe9d9"/>
    <rect x="572" y="240" width="142" height="28" rx="14" fill="#cfe9d9"/>
    <rect x="596" y="224" width="52" height="24" rx="12" fill="#1e8e3e"/>
    <text x="622" y="241" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">NDVI</text>
    <rect x="654" y="224" width="46" height="24" rx="12" fill="#d97706"/>
    <text x="677" y="241" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">LST</text>
  </g>
  <text x="640" y="294" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Google Earth Engine</text>
  <text x="640" y="314" text-anchor="middle" font-size="14" fill="#4b5563">ประมวลผลภาพถ่ายดาวเทียมบนคลาวด์</text>
  <text x="640" y="332" text-anchor="middle" font-size="14" fill="#4b5563">คำนวณพื้นที่สีเขียวและอุณหภูมิพื้นผิว</text>

  <!-- side inputs -->
  <rect x="792" y="198" width="196" height="92" rx="8" fill="#f7f9fb" stroke="#d5dde5" stroke-width="1.5"/>
  <text x="806" y="221" font-size="15" font-weight="bold" fill="#1f2937">ข้อมูลประกอบ</text>
  <text x="806" y="243" font-size="13.5" fill="#4b5563">• ประชากร (WorldPop)</text>
  <text x="806" y="262" font-size="13.5" fill="#4b5563">• ขอบเขตการปกครอง (GADM)</text>
  <text x="806" y="281" font-size="13.5" fill="#4b5563">• การใช้ที่ดิน · พื้นที่เมือง</text>
  <line x1="788" y1="244" x2="718" y2="244" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>

  <line x1="640" y1="346" x2="640" y2="400" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="652" y="362" font-size="13" fill="#4b5563">ค่าที่คำนวณแล้ว</text>
  <text x="652" y="379" font-size="13" fill="#4b5563">รายจังหวัดและอำเภอ</text>

  <!-- ===================== server ===================== -->
  <g>
    <rect x="596" y="410" width="88" height="22" rx="4" fill="#64748b"/>
    <circle cx="609" cy="421" r="4" fill="#86efac"/>
    <line x1="622" y1="421" x2="672" y2="421" stroke="#94a3b8" stroke-width="2"/>
    <rect x="596" y="437" width="88" height="22" rx="4" fill="#64748b"/>
    <circle cx="609" cy="448" r="4" fill="#86efac"/>
    <line x1="622" y1="448" x2="672" y2="448" stroke="#94a3b8" stroke-width="2"/>
    <rect x="596" y="464" width="88" height="22" rx="4" fill="#64748b"/>
    <circle cx="609" cy="475" r="4" fill="#fbbf24"/>
    <line x1="622" y1="475" x2="672" y2="475" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="640" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">เซิร์ฟเวอร์ของระบบ</text>
  <text x="640" y="532" text-anchor="middle" font-size="14" fill="#4b5563">จัดลำดับพื้นที่ควรปลูก</text>
  <text x="640" y="550" text-anchor="middle" font-size="14" fill="#4b5563">แนะนำพันธุ์ไม้ · ประเมิน CO2</text>

  <!-- ===================== database ===================== -->
  <g>
    <ellipse cx="878" cy="420" rx="42" ry="13" fill="#7c9fdd"/>
    <rect x="836" y="420" width="84" height="58" fill="#6b8fd4"/>
    <ellipse cx="878" cy="478" rx="42" ry="13" fill="#5a7cc0"/>
    <ellipse cx="878" cy="440" rx="42" ry="13" fill="none" stroke="#a8c2ec" stroke-width="1.5"/>
    <ellipse cx="878" cy="459" rx="42" ry="13" fill="none" stroke="#a8c2ec" stroke-width="1.5"/>
  </g>
  <text x="878" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ฐานข้อมูล</text>
  <text x="878" y="532" text-anchor="middle" font-size="14" fill="#4b5563">เก็บผลที่คำนวณไว้แล้ว</text>
  <text x="878" y="550" text-anchor="middle" font-size="14" fill="#4b5563">และบัญชีผู้ใช้งาน</text>

  <line x1="692" y1="448" x2="828" y2="448" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="760" y="420" text-anchor="middle" font-size="13" fill="#4b5563">จัดเก็บและ</text>
  <text x="760" y="436" text-anchor="middle" font-size="13" fill="#4b5563">เรียกใช้ข้อมูล</text>

  <!-- ===================== admin (above the web app) ===================== -->
  <g>
    <circle cx="388" cy="216" r="17" fill="#4aa3a2"/>
    <path d="M360,270 a28,26 0 0 1 56,0 z" fill="#4aa3a2"/>
    <circle cx="414" cy="250" r="11" fill="#ffffff" stroke="#4aa3a2" stroke-width="2"/>
    <circle cx="414" cy="250" r="4" fill="#4aa3a2"/>
  </g>
  <text x="388" y="298" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ผู้ดูแลระบบ</text>
  <text x="388" y="318" text-anchor="middle" font-size="14" fill="#4b5563">ล้างข้อมูลที่เก็บชั่วคราว</text>
  <text x="388" y="336" text-anchor="middle" font-size="14" fill="#4b5563">ลบพื้นที่ที่ผู้ใช้บันทึก</text>
  <text x="388" y="354" text-anchor="middle" font-size="14" fill="#4b5563">กำหนดสิทธิ์ผู้ใช้งาน</text>

  <line x1="388" y1="368" x2="388" y2="402" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="399" y="390" font-size="13" fill="#4b5563">สิทธิ์เพิ่มเติม</text>

  <!-- ===================== web app ===================== -->
  <g>
    <rect x="336" y="408" width="104" height="68" rx="6" fill="#334155"/>
    <rect x="343" y="415" width="90" height="54" rx="3" fill="#eaf4ee"/>
    <path d="M349,455 q10,-16 22,-8 q12,8 22,-10 q10,-16 34,-6 v28 h-78 z" fill="#9ed4b3"/>
    <circle cx="392" cy="432" r="6" fill="#e5484d"/>
    <rect x="349" y="419" width="26" height="6" rx="3" fill="#c3d9cc"/>
    <path d="M324,480 L452,480 L460,490 L316,490 z" fill="#94a3b8"/>
  </g>
  <text x="388" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">เว็บ Green Area Analysis</text>
  <text x="388" y="532" text-anchor="middle" font-size="14" fill="#4b5563">แผนที่ · กราฟ · พื้นที่ควรปลูก</text>
  <text x="388" y="550" text-anchor="middle" font-size="14" fill="#4b5563">และรายงาน PDF / CSV</text>

  <line x1="468" y1="448" x2="588" y2="448" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="528" y="420" text-anchor="middle" font-size="13" fill="#4b5563">ส่งผลวิเคราะห์</text>
  <text x="528" y="436" text-anchor="middle" font-size="13" fill="#4b5563">ไปแสดงผล</text>

  <!-- ===================== user ===================== -->
  <g>
    <circle cx="150" cy="428" r="17" fill="#e8a33d"/>
    <path d="M122,482 a28,26 0 0 1 56,0 z" fill="#e8a33d"/>
  </g>
  <text x="150" y="512" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ผู้ใช้ / นักวางผังเมือง</text>
  <text x="150" y="532" text-anchor="middle" font-size="14" fill="#4b5563">เลือกพื้นที่ ดูผล</text>
  <text x="150" y="550" text-anchor="middle" font-size="14" fill="#4b5563">และส่งออกรายงาน</text>

  <line x1="196" y1="448" x2="308" y2="448" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="252" y="420" text-anchor="middle" font-size="13" fill="#4b5563">เข้าใช้งาน</text>
  <text x="252" y="436" text-anchor="middle" font-size="13" fill="#4b5563">ผ่านการล็อกอิน</text>

  <text x="30" y="596" font-size="13" fill="#6b7280">หมายเหตุ: ระบบไม่จัดเก็บภาพถ่ายดาวเทียมดิบไว้เอง แต่เรียกใช้และประมวลผลจากคลังข้อมูลสาธารณะบน Google Earth Engine</text>
</svg>
